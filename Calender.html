<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Buddy - Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:radial-gradient(circle at top,#8E7CFF,#C38FFF);
    padding:20px;
}

.container{
    display:flex;
    gap:25px;
    max-width:1450px;
    margin:auto;
}

/* Sidebar */
.sidebar{
    width:300px;
    min-height:92vh;
    padding:25px;
    border-radius:30px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 10px 35px rgba(0,0,0,0.15);
    color:white;
}

/* IMPORTANT: make <a> behave like div */
.menu_items{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px;
    margin-bottom:18px;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    cursor:pointer;
    transition:0.3s;
    text-decoration:none;
    color:white;
}

.menu_items:hover{
    background:rgba(255,255,255,0.22);
    transform:translateX(5px);
}

.active{
    background:white;
    color:#7A5FFF;
    font-weight:600;
}

/* Main */
.main{
    flex:1;
    min-height:92vh;
    padding:30px;
    border-radius:30px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 10px 35px rgba(0,0,0,0.15);
}

/* Header */
.header-card{
    background:rgba(255,255,255,0.18);
    border-radius:25px;
    padding:30px;
    color:white;
    margin-bottom:25px;
    border:1px solid rgba(255,255,255,0.2);
}

.header-card h2{
    font-size:36px;
    margin-bottom:8px;
}

.header-card p{
    font-size:17px;
    color:#f5f5f5;
}

</style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:35px;">
            <h2 style="color:white;">STUDY BUDDY</h2>
        </div>

        <a href="main_page.html" class="menu_items">
            🏠 <span>Home</span>
        </a>

        <a href="Study_resources.html" class="menu_items">
            📚 <span>Study Resources</span>
        </a>

        <a href="Quiz and Revision.html" class="menu_items">
            📝 <span>Quiz & Revision</span>
        </a>

        <a href="Calender.html" class="menu_items active">
            📅 <span>Calendar</span>
        </a>

        <a href="setting.html" class="menu_items">
            ⚙️ <span>Settings</span>
        </a>

    </div>

    <!-- Main -->
    <div class="main">

        <div class="header-card">
            <h2>Calendar Planning</h2>
            <p>Plan your week, manage deadlines and stay organised.</p>
        </div>

    </div>

</div>

</body>
<script>
    async function fetchData() {
        try {
            const response = await fetch('calander.py');
            const data = await response.json();
            console.log(data);
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }
</script>
</html>
