<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Buddy Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(#8E7CFF,#C38FFF);
    padding:20px;
}

.signup-container{
    width:420px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:30px;
    padding:45px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
}

.signup-title{
    text-align:center;
    margin-bottom:35px;
}

.signup-title h1{
    color:white;
    font-size:40px;
    font-weight:700;
    margin-bottom:10px;
}

.signup-title p{
    color:#f3f3f3;
    font-size:15px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    color:white;
    font-size:14px;
    display:block;
    margin-bottom:8px;
}

.input-group input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    outline:none;
    font-size:15px;
    background:rgba(255,255,255,0.9);
    transition:0.3s;
}

.input-group input:focus{
    box-shadow:0 0 15px rgba(255,255,255,0.4);
}

.signup-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:white;
    color:#7A5FFF;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

.signup-btn:hover{
    background:#ece8ff;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    display:none;
}

.bottom-text{
    text-align:center;
    margin-top:25px;
    color:white;
    font-size:14px;
}

.bottom-text a{
    color:white;
    font-weight:600;
    text-decoration:none;
}

.bottom-text a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="signup-container">

    <div class="signup-title">
        <h1>Study Buddy</h1>
        <p>Create your account and start studying smarter.</p>
    </div>

    <form id="signupForm">

        <div class="input-group">
            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required>
        </div>

        <button type="submit" class="signup-btn">
            Sign Up
        </button>

        <p id="message" class="message"></p>

    </form>

    <div class="bottom-text">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <button onclick="clearUsers()" style="display:none;">Clear Users</button>

</div>

<script>

document.getElementById("signupForm").addEventListener("submit", function(event){

    event.preventDefault();

    const name = document.getElementById("name").value.trim();

    const email = document.getElementById("email")
                    .value.trim()
                    .toLowerCase();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("message");

    message.style.display = "none";

    // Check if passwords match
    if(password !== confirmPassword){

        message.style.display = "block";
        message.style.color = "#ffdddd";
        message.textContent = "Passwords do not match!";
        return;
    }

    // Get existing users
    let users = JSON.parse(localStorage.getItem("users")) || [];

    // Check if email already exists
    const emailExists = users.some(
        user => user.email.toLowerCase() === email
    );

    if(emailExists){

        message.style.display = "block";
        message.style.color = "#ffdddd";
        message.textContent = "This email is already registered!";
        return;
    }

    // Save new user
    users.push({
        name: name,
        email: email,
        password: password
    });

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

    message.style.display = "block";
    message.style.color = "#d4ffd4";
    message.textContent =
        "Account created successfully! Redirecting to login page...";

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1500);

});

    function clearUsers() {
        localStorage.clear();
        alert("Local Storage cleared.");
    }

</script>

</body>
</html>
