<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Buddy - Log Out</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:radial-gradient(circle at top,#8E7CFF,#C38FFF);
    padding:20px;
}

.container{
    display:flex;
    gap:25px;
    max-width:1450px;
    margin:auto;
}

/* Sidebar */

.sidebar{
    width:300px;
    min-height:92vh;
    padding:25px;
    border-radius:30px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 10px 35px rgba(0,0,0,0.15);
    color:white;
}

.sidebar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.x_button button{
    background:rgba(255,255,255,0.2);
    border:none;
    color:white;
    width:45px;
    height:45px;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
}

.menu_items{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px;
    margin-bottom:18px;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    cursor:pointer;
    transition:0.3s;
    text-decoration:none;
    color:white;
}

.menu_items:hover{
    background:rgba(255,255,255,0.22);
    transform:translateX(5px);
}

.active{
    background:white;
    color:#7A5FFF;
    font-weight:600;
}

/* Main */

.main{
    flex:1;
    min-height:92vh;
    padding:30px;
    border-radius:30px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 10px 35px rgba(0,0,0,0.15);

    display:flex;
    flex-direction:column;
    justify-content:center;
}

/* Header */

.header-card{
    background:rgba(255,255,255,0.18);
    border-radius:25px;
    padding:30px;
    color:white;
    margin-bottom:25px;
    border:1px solid rgba(255,255,255,0.2);
    text-align:center;
}

.header-card h2{
    font-size:38px;
    margin-bottom:10px;
}

/* Logout Card */

.logout-card{
    background:rgba(255,255,255,0.18);
    border-radius:25px;
    padding:70px 40px;
    color:white;
    border:1px solid rgba(255,255,255,0.2);
    text-align:center;
}

.logout-card h3{
    font-size:30px;
    margin-bottom:15px;
}

.logout-card p{
    font-size:16px;
    margin-bottom:35px;
    opacity:0.9;
}

/* Logout Button */

.logout-btn{
    width:250px;
    padding:15px;
    border:none;
    border-radius:18px;
    background:#ff5b7f;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.logout-btn:hover{
    background:#ff416c;
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(255,65,108,0.35);
}

</style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="sidebar-header">
            <h2>STUDY BUDDY</h2>

            <div class="x_button">
                <button>☰</button>
            </div>
        </div>

        <a href="main_page.html" class="menu_items">
            🏠 <span>Home</span>
        </a>

        <a href="Study_resources.html" class="menu_items">
            📚 <span>Study Resources</span>
        </a>

        <a href="Quiz and Revision.html" class="menu_items">
            📝 <span>Quiz & Revision</span>
        </a>

        <a href="Calender.html" class="menu_items">
            📅 <span>Calendar</span>
        </a>

        <a href="logout.html" class="menu_items active">
            🚪 <span>Log Out</span>
        </a>

    </div>

    <!-- Main Content -->
    <div class="main">

        <div class="header-card">
            <h2>Log Out 👋</h2>
            <p>Securely sign out of your Study Buddy account.</p>
        </div>

        <div class="logout-card">

            <h3>Ready to Leave?</h3>

            <p>
                You will be logged out of your account and returned to the login page.
            </p>

            <button class="logout-btn"
                    onclick="window.location.href='Signup.html'">
                Log Out
            </button>

        </div>

    </div>

</div>

</body>
</html>
