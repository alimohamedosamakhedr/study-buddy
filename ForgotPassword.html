<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(#8E7CFF,#C38FFF);
}

.container{
    width:430px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:40px;
    border:1px solid rgba(255,255,255,0.2);
}

h1{
    color:white;
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    color:white;
    text-align:center;
    font-size:14px;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    color:white;
    display:block;
    margin-bottom:8px;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:15px;
    outline:none;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

#sendOTP{
    margin-bottom:20px;
    background:#ffffff;
    color:#7A5FFF;
}

#sendOTP:hover{
    background:#ece8ff;
}

#verifyOTP{
    margin-bottom:20px;
    background:#ffffff;
    color:#7A5FFF;
}

#verifyOTP:hover{
    background:#ece8ff;
}

#resetBtn{
    background:#ffffff;
    color:#7A5FFF;
}

#resetBtn:hover{
    background:#ece8ff;
}

#resetBtn:disabled{
    background:#d7d7d7;
    color:#888;
    cursor:not-allowed;
}

.timer{
    margin-top:-10px;
    margin-bottom:20px;
    text-align:center;
    color:white;
    font-weight:bold;
    display:none;
}

.resend{
    text-align:center;
    margin-bottom:20px;
    display:none;
}

.resend a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.message{
    margin-top:20px;
    color:white;
    text-align:center;
}

.back{
    text-align:center;
    margin-top:25px;
}

.back a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

</style>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

</head>

<body>

<div class="container">

<h1>Forgot Password</h1>

<p class="subtitle">
Enter your email to receive a verification OTP.
</p>

<form id="resetForm">

<div class="input-group">
<label>Email</label>
<input
type="email"
id="email"
required>
</div>

<button
type="button"
id="sendOTP">
Send OTP
</button>

<div class="timer" id="timer">
15:00
</div>

<div class="input-group">
<label>OTP Code</label>
<input
type="text"
id="otp"
maxlength="6"
placeholder="Enter 6-digit OTP">
</div>

<button
type="button"
id="verifyOTP">
Verify OTP
</button>

<div class="resend" id="resend">
<a href="#" id="resendOTP">
Resend OTP
</a>
</div>

<div class="input-group">
<label>New Password</label>
<input
type="password"
id="newPassword"
disabled
required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input
type="password"
id="confirmPassword"
disabled
required>
</div>

<button
type="submit"
id="resetBtn"
disabled>
Reset Password
</button>

</form>

<p class="message" id="message"></p>

<div class="back">
<a href="Login.html">
← Back to Login
</a>
</div>

</div>

<script>
// ===============================
// EmailJS Configuration
// ===============================

const PUBLIC_KEY = "aneKk63232SCSLr-W";
const SERVICE_ID = "service_1y6yowd";
const TEMPLATE_ID = "template_8fhzy9m";

emailjs.init(PUBLIC_KEY);

// ===============================

let generatedOTP = "";
let otpVerified = false;
let timer = null;
let timeLeft = 900;

const message = document.getElementById("message");

const sendOTPBtn = document.getElementById("sendOTP");
const verifyOTPBtn = document.getElementById("verifyOTP");

const timerDisplay = document.getElementById("timer");
const resendDiv = document.getElementById("resend");

const emailInput = document.getElementById("email");
const otpInput = document.getElementById("otp");

const newPassword = document.getElementById("newPassword");
const confirmPassword = document.getElementById("confirmPassword");

const resetBtn = document.getElementById("resetBtn");

// ===============================
// Generate OTP
// ===============================

function generateOTP(){
    return Math.floor(100000 + Math.random() * 900000).toString();
}

// ===============================
// Countdown Timer
// ===============================

function startTimer(){

    clearInterval(timer);

    timeLeft = 900;

    timerDisplay.style.display = "block";
    resendDiv.style.display = "none";

    timer = setInterval(function(){

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        timerDisplay.innerHTML =
            String(minutes).padStart(2,"0") + ":" +
            String(seconds).padStart(2,"0");

        if(timeLeft <= 0){

            clearInterval(timer);

            generatedOTP = "";
            otpVerified = false;

            timerDisplay.innerHTML = "OTP Expired";

            resendDiv.style.display = "block";

        }

        timeLeft--;

    },1000);

}

// ===============================
// Send OTP
// ===============================

sendOTPBtn.addEventListener("click", function(){

    const email = emailInput.value.trim();

    const savedEmail = localStorage.getItem("userEmail");

    if(email === ""){

        message.style.color="#ffd6d6";
        message.innerHTML="Please enter your email.";
        return;

    }

    if(email !== savedEmail){

        message.style.color="#ffd6d6";
        message.innerHTML="Email not found.";
        return;

    }

    generatedOTP = generateOTP();

        emailjs.send(
            "service_1y6yowd",
            "template_8fhzy9m",
            {
                user_email: email,
                otp_code: generatedOTP
            }
        )
    .then(function(){

        message.style.color="#d4ffd4";
        message.innerHTML="OTP has been sent to your email.";

        otpInput.disabled = false;
        verifyOTPBtn.disabled = false;

        startTimer();

    })

    .catch(function(error){

        console.error(error);

        message.style.color="#ffd6d6";
        message.innerHTML="Unable to send OTP.";

    });

});

// ===============================
// Resend OTP
// ===============================

document.getElementById("resendOTP").addEventListener("click", function(e){

    e.preventDefault();

    sendOTPBtn.click();

});

// ===============================
// Verify OTP
// ===============================

verifyOTPBtn.addEventListener("click", function(){

    const enteredOTP = otpInput.value.trim();

    if(generatedOTP === ""){

        message.style.color="#ffd6d6";
        message.innerHTML="OTP has expired.";

        return;

    }

    if(enteredOTP !== generatedOTP){

        message.style.color="#ffd6d6";
        message.innerHTML="Incorrect OTP.";

        return;

    }

    otpVerified = true;

    generatedOTP = "";

    clearInterval(timer);

    timerDisplay.innerHTML = "Verified ✓";

    message.style.color="#d4ffd4";
    message.innerHTML="OTP verified successfully.";

    otpInput.disabled = true;
    verifyOTPBtn.disabled = true;

    newPassword.disabled = false;
    confirmPassword.disabled = false;

    resetBtn.disabled = false;

});

// ===============================
// Reset Password
// ===============================

document.getElementById("resetForm").addEventListener("submit", function(e){

    e.preventDefault();

    if(!otpVerified){

        message.style.color="#ffd6d6";
        message.innerHTML="Please verify the OTP first.";

        return;

    }

    const password = newPassword.value;

    const confirm = confirmPassword.value;

    if(password.length < 8){

        message.style.color="#ffd6d6";
        message.innerHTML="Password must be at least 8 characters.";

        return;

    }

    if(password !== confirm){

        message.style.color="#ffd6d6";
        message.innerHTML="Passwords do not match.";

        return;

    }

    localStorage.setItem("userPassword", password);

    message.style.color="#d4ffd4";
    message.innerHTML="Password updated successfully! Redirecting...";

    newPassword.disabled = true;
    confirmPassword.disabled = true;

    resetBtn.disabled = true;
    sendOTPBtn.disabled = true;

    setTimeout(function(){

        window.location.href = "Login.html";

    },1500);

});


</script>

</body>
</html>
