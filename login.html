
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Buddy Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(#8E7CFF,#C38FFF);
    overflow:hidden;
}

.login-container{
    width:400px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:30px;
    padding:45px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
}

.login-title{
    text-align:center;
    margin-bottom:35px;
}

.login-title h1{
    color:white;
    font-size:40px;
    font-weight:700;
    margin-bottom:10px;
}

.login-title p{
    color:#f3f3f3;
    font-size:15px;
}

.input-group{
    margin-bottom:25px;
}

.input-group label{
    color:white;
    font-size:14px;
    display:block;
    margin-bottom:8px;
}

.input-group input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    outline:none;
    font-size:15px;
    background:rgba(255,255,255,0.9);
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:white;
    color:#7A5FFF;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
}

.error-message{
    color:#ffdddd;
    text-align:center;
    margin-top:15px;
    display:none;
}

.success-message{
    color:#d4ffd4;
    text-align:center;
    margin-top:15px;
    display:none;
}

.bottom-text{
    text-align:center;
    margin-top:25px;
    color:white;
    font-size:14px;
}

.bottom-text a{
    color:white;
    font-weight:600;
    text-decoration:none;
}

.forgot-text{
    text-align:center;
    margin-top:15px;
}

.forgot-text a{
    color:white;
    font-size:14px;
    text-decoration:none;
    font-weight:500;
}

.forgot-text a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="login-title">
        <h1>Study Buddy</h1>
        <p>Welcome back! Login to continue studying.</p>
    </div>
    <!--user inputs-->
    <form id="loginForm">

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" required>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>
    <!--messageif error-->
    <p class="error-message" id="errorMessage">
        Invalid email or password.
    </p>
    <!--message if success-->
    <p class="success-message" id="successMessage">
        Sending OTP...
    </p>
    <!-- sign up -->
    <div class="bottom-text">
        Don't have an account?
        <a href="Signup.html">Sign Up</a>
    </div>
    <!--forgot password text-->
    <div class="forgot-text">
     <a href="ForgotPassword.html">Forgot Password?</a>
    </div>

</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
//initailze emailjs 
emailjs.init("aneKk63232SCSLr-W");

document.getElementById("loginForm").addEventListener("submit", function(event){ //run when input is received

    event.preventDefault(); // prevent page reload

    const email = document.getElementById("email")
                    .value.trim() //remove spaces in email
                    .toLowerCase();//convert to lowercase

    const password = document.getElementById("password").value;

    const users = JSON.parse(localStorage.getItem("users")) || [];

    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");

    errorMessage.style.display = "none";
    successMessage.style.display = "none"; //clears both messages

    // Find matching user
    const user = users.find(user =>
        user.email.toLowerCase() === email &&
        user.password === password
    );

    if(user){

        // Optional: remember who logged in
        localStorage.setItem(
            "currentUser",
            JSON.stringify(user)
        );

        // Generate OTP
        const otp = Math.floor(
            100000 + Math.random() * 900000
        ).toString();

        localStorage.setItem("loginOTP", otp);
        localStorage.setItem("otpEmail", email);

        // OTP expires in 15 minutes
        const expiryTime = Date.now() + (15 * 60 * 1000);
        localStorage.setItem("otpExpiry", expiryTime);

        successMessage.style.display = "block";
        successMessage.innerHTML = "Sending OTP...";

        emailjs.send(
            "service_1y6yowd",
            "template_8fhzy9m",
            {
                user_email: email,
                otp_code: otp
            }
        )
        .then(function(response){

            console.log("SUCCESS:", response);
            window.location.href = "otp.html";

        })
        .catch(function(error){

            console.log("FAILED:", error);

            successMessage.style.display = "none";
            errorMessage.style.display = "block";
            errorMessage.innerHTML =
                "Failed to send OTP. Try again.";

        });
        //if failed
    }
    else{

        errorMessage.style.display = "block";
        errorMessage.innerHTML =
            "Invalid email or password.";

    }

});
</script>

</body>
</html>
